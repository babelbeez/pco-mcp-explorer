# Dependencies are pinned at known-good versions. Dependabot is configured for
# security updates only: open-pull-requests-limit: 0 disables routine
# version-refresh PRs, while security advisories still open PRs (they are not
# subject to the limit).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
